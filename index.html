<html lang="ko">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 책 DB</title>
<style>

  h1 { font-size: 20px; font-weight: 600; margin-bottom: 1.5rem; letter-spacing: -0.3px; }

  .search-box { flex: 1; display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #e0ddd6; border-radius: 8px; padding: 0 12px; }
  .search-box svg { color: #999; flex-shrink: 0; }
  .search-box input { flex: 1; border: none; background: transparent; font-size: 14px; color: #1a1a1a; height: 38px; outline: none; font-family: inherit; }
  .add-btn { display: flex; align-items: center; gap: 6px; padding: 0 14px; height: 38px; background: #1a1a1a; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit; white-space: nowrap; }
  .add-btn:hover { background: #333; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 1.25rem; }
  .stat { background: #fff; border: 1px solid #e0ddd6; border-radius: 8px; padding: 10px 14px; }
  .stat-label { font-size: 11px; color: #888; margin-bottom: 3px; }
  .stat-num { font-size: 20px; font-weight: 600; }
  .dup-banner { display: none; background: #fff8e6; border: 1px solid #f5d97a; border-radius: 8px; padding: 8px 12px; margin-bottom: 1rem; font-size: 13px; color: #7a5900; align-items: center; gap: 6px; }
  .dup-banner.show { display: flex; }
  .book-list { display: flex; flex-direction: column; gap: 5px; }
  .book-card { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid #e0ddd6; border-radius: 10px; padding: 10px 14px; transition: border-color 0.15s; }
  .book-card:hover { border-color: #bbb; }
  .book-info { flex: 1; min-width: 0; }
  .book-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .book-meta { font-size: 12px; color: #888; margin-top: 2px; }
  .book-right { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  .badge-dup { font-size: 11px; padding: 2px 7px; border-radius: 20px; background: #fff3cd; color: #856404; font-weight: 500; border: 1px solid #f5d97a; white-space: nowrap; }
  .stat-dup-btn { cursor: pointer; background: #fff; border: 1px solid #f5d97a; border-radius: 8px; padding: 10px 14px; text-align: left; font-family: inherit; width: 100%; transition: background 0.15s; }
  .stat-dup-btn:hover { background: #fff8e6; }
  .stat-dup-btn .stat-label { font-size: 11px; color: #856404; margin-bottom: 3px; }
  .stat-dup-btn .stat-num { font-size: 20px; font-weight: 600; color: #856404; }
  .stat-dup-btn .stat-hint { font-size: 10px; color: #b38a00; margin-top: 2px; }
  .dup-panel { display: none; background: #fffbf0; border: 1px solid #f5d97a; border-radius: 10px; padding: 14px 16px; margin-bottom: 1rem; }
  .dup-panel.open { display: block; }
  .dup-panel-title { font-size: 13px; font-weight: 600; color: #7a5900; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .dup-panel-close { background: none; border: none; cursor: pointer; font-size: 16px; color: #b38a00; line-height: 1; padding: 0; }
  .dup-group { margin-bottom: 12px; }
  .dup-group:last-child { margin-bottom: 0; }
  .dup-group-label { font-size: 11px; color: #888; margin-bottom: 5px; }
  .dup-item { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #f5d97a; border-radius: 7px; padding: 7px 10px; margin-bottom: 4px; }
  .dup-item:last-child { margin-bottom: 0; }
  .dup-item-title { font-size: 13px; font-weight: 500; flex: 1; }
  .dup-item-date { font-size: 11px; color: #888; }
  .del-btn { background: none; border: none; cursor: pointer; color: #ccc; font-size: 15px; padding: 3px 5px; border-radius: 4px; line-height: 1; }
  .del-btn:hover { color: #e53935; background: #fff0f0; }
  .empty { text-align: center; padding: 3rem 0; color: #aaa; font-size: 14px; }
  .pg { display: flex; gap: 5px; align-items: center; justify-content: center; margin-top: 1rem; flex-wrap: wrap; }
  .pg button { height: 30px; padding: 0 11px; border: 1px solid #e0ddd6; border-radius: 6px; background: #fff; color: #1a1a1a; font-size: 12px; cursor: pointer; font-family: inherit; }
  .pg button.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .pg button:disabled { opacity: 0.3; cursor: default; }
  .pg-info { font-size: 12px; color: #888; padding: 0 4px; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 12px; padding: 1.5rem; width: 100%; max-width: 400px; margin: 1rem; box-shadow: 0 8px 32px rgba(0,0,0,0.15); }
  .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 1.25rem; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; color: #888; margin-bottom: 4px; }
  .field input { width: 100%; height: 36px; font-size: 14px; padding: 0 10px; border: 1px solid #e0ddd6; border-radius: 8px; background: #fff; color: #1a1a1a; outline: none; font-family: inherit; }
  .field input:focus { border-color: #1a1a1a; }
  .dup-warn { display: none; background: #fff8e6; border: 1px solid #f5d97a; border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; font-size: 12px; color: #7a5900; }
  .dup-warn.show { display: block; }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1rem; }
  .modal-btns button { height: 34px; padding: 0 16px; border-radius: 8px; font-size: 13px; cursor: pointer; font-family: inherit; }
  .btn-cancel { background: #fff; border: 1px solid #e0ddd6; color: #1a1a1a; }
  .btn-cancel:hover { background: #f7f6f3; }
  .btn-save { background: #1a1a1a; border: none; color: #fff; }
  .btn-save:hover { background: #333; }
  @media (max-width: 480px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="container">
  <h1>📚 내 책 DB</h1>
  <div class="top-bar">
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="제목, 저자로 검색..." oninput="onSearch()" />
    </div>
    <button class="add-btn" onclick="openModal()">+ 책 추가</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-label">전체 책</div><div class="stat-num" id="statTotal">0</div></div>

    <div class="stat"><div class="stat-label">구매 기간</div><div class="stat-num" id="statPeriod" style="font-size:13px;padding-top:5px">-</div></div>
    <div class="stat"><div class="stat-label">검색 결과</div><div class="stat-num" id="statFiltered">0</div></div>
  </div>
  <div class="dup-panel" id="dupPanel"><div class="dup-panel-title"><span>⚠ 중복 의심 도서</span><button class="dup-panel-close" onclick="toggleDupPanel()">✕</button></div><div id="dupPanelBody"></div></div>
  <div class="dup-banner" id="dupBanner">⚠ <span id="dupBannerText"></span></div>
  <div class="book-list" id="bookList"></div>
  <div class="pg" id="pgBar"></div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeBg(event)">
  <div class="modal">
    <h3 id="modalTitle">새 책 추가</h3>
    <div class="field"><label>제목 *</label><input id="fTitle" placeholder="책 제목" oninput="checkDup()" /></div>
    <div class="field"><label>저자</label><input id="fAuthor" placeholder="저자명" oninput="checkDup()" /></div>
    <div class="field"><label>구매일</label><input id="fDate" type="date" /></div>
    <div class="dup-warn" id="dupWarn"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveBook()">저장</button>
    </div>
  </div>
</div>

function init() {
  try {
    const raw = localStorage.getItem('bookDB_v3');
    if (raw) { books = JSON.parse(raw); render(); return; }
  } catch(e) {}
  books = RAW.map((r, i) => ({ id: i+1, title: r[0], author: r[1], date: r[2] }));
  save(); render();
}

function save() {
  try { localStorage.setItem('bookDB_v3', JSON.stringify(books)); } catch(e) {}
}

function norm(s) { return (s||'').replace(/\s/g,'').toLowerCase(); }

function findDups(title, excludeId) {
  return books.filter(b => {
    if (b.id === excludeId) return false;
    const t1 = norm(title), t2 = norm(b.title);
    if (!t1 || t1.length < 2) return false;
    return t1 === t2 || (t1.length > 4 && (t1.includes(t2) || t2.includes(t1)));
  });
}

function getDupIds() {
  const ids = new Set();
  books.forEach(b => { if (findDups(b.title, b.id).length) ids.add(b.id); });
  return ids;
}

function getFiltered() {
  const q = norm(document.getElementById('searchInput').value);
  if (!q) return [...books];
  return books.filter(b => norm(b.title).includes(q) || norm(b.author).includes(q));
}

function render() {
  const filtered = getFiltered();
  const dupIds = getDupIds();
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if (page > totalPages) page = totalPages;
  const slice = filtered.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);

  document.getElementById('statTotal').textContent = books.length;
  document.getElementById('statDup').textContent = dupIds.size;
  const dates = books.map(b=>b.date).filter(Boolean).sort();
  if (dates.length) {
    const y1=dates[0].slice(0,4), y2=dates[dates.length-1].slice(0,4);
    document.getElementById('statPeriod').textContent = y1===y2?y1:y1+'~'+y2;
  }
  document.getElementById('statFiltered').textContent = filtered.length;

  const q = document.getElementById('searchInput').value;
  const banner = document.getElementById('dupBanner');
  const dupInResult = filtered.filter(b=>dupIds.has(b.id));
  if (q && dupInResult.length) {
    banner.classList.add('show');
    document.getElementById('dupBannerText').textContent = `검색 결과 중 ${dupInResult.length}권 중복 의심`;
  } else { banner.classList.remove('show'); }

  const list = document.getElementById('bookList');
  if (!slice.length) {
    list.innerHTML = '<div class="empty">검색 결과가 없습니다</div>';
  } else {
    list.innerHTML = slice.map(b => `
      <div class="book-card">
        <div class="book-info">
          <div class="book-title">${esc(b.title)}</div>
          <div class="book-meta">${b.date||''}${b.author?' · '+esc(b.author):''}</div>
        </div>
        <div class="book-right">
          ${dupIds.has(b.id) ? `<span class="badge-dup">⚠ 중복<span class="tooltip">→ "${findDups(b.title, b.id).map(d=>d.title).join('", "')}"</span></span>` : ''}
          <button class="del-btn" onclick="delBook(${b.id})" title="삭제">✕</button>
        </div>
      </div>`).join('');
  }

  const pg = document.getElementById('pgBar');
  if (totalPages <= 1) { pg.innerHTML=''; return; }
  let html = `<button onclick="goPage(${page-1})" ${page===1?'disabled':''}>‹</button>`;
  const s=Math.max(1,page-2), e=Math.min(totalPages,page+2);
  if (s>1) html+=`<button onclick="goPage(1)">1</button>${s>2?'<span class="pg-info">…</span>':''}`;
  for(let i=s;i<=e;i++) html+=`<button class="${i===page?'active':''}" onclick="goPage(${i})">${i}</button>`;
  if(e<totalPages) html+=`${e<totalPages-1?'<span class="pg-info">…</span>':''}<button onclick="goPage(${totalPages})">${totalPages}</button>`;
  html+=`<button onclick="goPage(${page+1})" ${page===totalPages?'disabled':''}>›</button><span class="pg-info">${page}/${totalPages}</span>`;
  pg.innerHTML = html;
}

function goPage(p) { page=p; render(); }
function onSearch() { page=1; render(); }
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function delBook(id) { if(!confirm('삭제할까요?')) return; books=books.filter(b=>b.id!==id); save(); render(); }

function openModal() {
  editId=null;
  document.getElementById('modalTitle').textContent='새 책 추가';
  document.getElementById('fTitle').value='';
  document.getElementById('fAuthor').value='';
  document.getElementById('fDate').value=new Date().toISOString().slice(0,10);
  document.getElementById('dupWarn').style.display='none';
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('fTitle').focus(),50);
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
function closeBg(e) { if(e.target===document.getElementById('modalOverlay')) closeModal(); }

function checkDup() {
  const title = document.getElementById('fTitle').value;
  const dups = findDups(title, editId);
  const warn = document.getElementById('dupWarn');
  if (dups.length && title.length > 1) {
    warn.textContent = `⚠ "${dups[0].title}"와 중복 가능성이 있습니다!`;
    warn.style.display = 'block';
  } else { warn.style.display='none'; }
}

function saveBook() {
  const title = document.getElementById('fTitle').value.trim();
  if (!title) { alert('제목을 입력해주세요'); return; }
  books.unshift({ id: Date.now(), title, author: document.getElementById('fAuthor').value.trim(), date: document.getElementById('fDate').value });
  save(); closeModal(); page=1; render();
}


function toggleDupPanel() {
  const panel = document.getElementById('dupPanel');
  const isOpen = panel.classList.contains('open');
  if (isOpen) { panel.classList.remove('open'); return; }
  const dupIds = getDupIds();
  if (!dupIds.size) return;
  const visited = new Set();
  const groups = [];
  books.forEach(b => {
    if (visited.has(b.id)) return;
    const dups = findDups(b.title, b.id);
    if (!dups.length) return;
    const group = [b, ...dups];
    group.forEach(x => visited.add(x.id));
    groups.push(group);
  });
  document.getElementById('dupPanelBody').innerHTML = groups.map((group, i) =>
    '<div class="dup-group"><div class="dup-group-label">중복 그룹 ' + (i+1) + '</div>' +
    group.map(b => '<div class="dup-item"><span class="dup-item-title">' + esc(b.title) + '</span><span class="dup-item-date">' + (b.date||'') + '</span></div>').join('') +
    '</div>'
  ).join('');
  panel.classList.add('open');
}

init();
</script>
